name: Daily AI Learning
on:
  schedule:
    # Daily at 03:30 UTC (09:00 IST)
    - cron: "30 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate-note:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Daily Note
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate.py

      - name: Commit Changes
        run: |
          git config user.name "2005-shubham"
          git config user.email "shubhamsharmaalwar89@gmail.com"
          git add .
          git diff --cached --quiet || git commit -m "🤖 Daily AI Learning $(date -u +'%Y-%m-%d')"
          git push
